[project]
name = "healthkit"
version = "0.0.1"
description = "Code-health toolkit: a pre-merge gate on changed lines, and a module checkup."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
healthkit = "healthkit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff==0.17.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# healthkit's own code: strict from the first commit (slice 002 decision).
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "slices",  # trial evidence and measurement scripts, not toolkit code
    "src/healthkit/rules/*.py",  # rule fixtures: deliberately bad code
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings: style decided later; module/function docs are still written
    "COM812",  # conflicts with the formatter
    "CPY001",  # no copyright header
]

[tool.ruff.lint.per-file-ignores]
"src/healthkit/cli.py" = ["T201"]  # printing is the CLI's job
"src/healthkit/apicheck.py" = ["T201"]  # a CLI command too
"tests/**" = ["S101", "PLR2004", "ANN", "INP001", "S603", "S607"]
