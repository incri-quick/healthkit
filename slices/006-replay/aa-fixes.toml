# Answer key for the replay (slice 006). Drafted by Claude, reviewed by hand; Susheel
# may correct it. QuickRPA backend history. "kind" is a JUDGEMENT:
#   pattern   - visible in the shape of the code in one place
#   structure - who imports whom
#   knowledge - needs to know the project (shared helpers, token types, routes in use)
#   behaviour - does it do the right thing (logic, races, limits, validation, wording of intent)
#   judgement - naming meaning, module placement, wording, docs
#   tests     - a missing or weak test; no code line to point at
# source: "review" = his review file (deafb68^:docs/code-review/reviews/users-auth-a-tokens-password.md),
#         "commit" = only the fix commit's message (AA-36+ live in his private notes).
# Only explicit fixes ("code review AA-xx", "closes AA-xx", "(1 of 3)") are listed.
# Not scored (no explicit fix commit, follow-up only, or another repo):
#   AA-07, 08, 10, 11, 12, 17, 21, 23, 24, 25, 28, 29, 30, 31 (review, no explicit fix),
#   AA-34 (frontend repo), AA-38 (follow-up only).

# Rules written FROM these incidents: hits by them are excluded from Score B.
[derived]
"exception-text-in-reply" = "AA-15"
"raw-json-body" = "AA-65"
"api-above-services" = "AA-06"

# JUDGED hits (added after the first run showed line overlap overcounts: a finding that
# merely sits inside a rewritten or deleted block is a coincidence). An AA counts as
# caught only by a rule listed here: one that names the problem ("direct") or points at
# the exact line where the problem is visible ("pointer"). Each judged by reading the
# flagged line at the fix's parent (slice 006 RESULTS lists them).
[judged]
"AA-06" = ["import-linter api-above-services"]  # direct (derived rule)
"AA-13" = ["ruff RUF052"]                        # direct: `_pca` used as a dummy name
"AA-15" = ["opengrep exception-text-in-reply", "ruff BLE001"]  # direct (derived) + pointer: the catch-all
"AA-19" = ["ruff I001"]                          # direct: import hygiene
"AA-32" = ["ruff F821"]                          # direct: dead code referencing an undefined name
"AA-59" = ["ruff BLE001"]                        # pointer: `except Exception as e: raise HttpError(400, f"...{str(e)}")`
"AA-63" = ["ruff PLC2701"]                       # direct: `from users.api.users import _login_throttle_ctx`
"AA-65" = ["opengrep raw-json-body"]             # direct (derived rule)
"AA-67" = ["ruff RUF052"]                        # direct: `_password`, `_ip`, `_db_counter`
"AA-69" = ["ruff N814"]                          # direct: `AccessToken as _AT`
"AA-74" = ["ruff BLE001"]                        # pointer: the `except Exception:` that hid whether revocation happened

